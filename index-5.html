<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imperial Crown Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f8;--surface:#fff;--ink:#3a1424;--muted:#7a5566;--plum:#6b1238;--gold:#a8365a;--gold2:#f5c9b8;--line:#f0d9e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c0a14;--surface:#2a1220;--ink:#fbeaf0;--muted:#c9a8b6;--line:#4a2336}}
:root[data-theme="dark"]{--bg:#1c0a14;--surface:#2a1220;--ink:#fbeaf0;--muted:#c9a8b6;--line:#4a2336}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 Jost,system-ui,sans-serif}
h1,h2,h3,.brand{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.1}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--plum);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:24px;padding:14px 20px;background:var(--plum);color:#fff1ec}
.brand{font-size:24px;letter-spacing:.02em;margin-right:auto;text-decoration:none}
header nav{display:none;gap:26px;font-size:15px}
header nav a,header .hr a{text-decoration:none;opacity:.85}
header nav a:hover{opacity:1}
@media(min-width:720px){header nav{display:flex}}
.hr{display:flex;align-items:center;gap:16px}
.cartbtn{border:1px solid var(--gold2);border-radius:99px;padding:6px 18px;color:var(--gold2);font-size:15px}
.hero{background:var(--plum) center/cover;color:#fff1ec;padding:84px 0 92px;text-align:center}
.hero h1{font-size:clamp(40px,7.5vw,68px);max-width:12em;margin:0 auto 18px;color:var(--gold2)}
.hero p{max-width:34em;margin:0 auto 32px;color:#f1d3de;font-size:18px}
.ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cta{display:inline-block;background:var(--gold2);color:var(--plum);padding:13px 30px;border-radius:4px;font-weight:500;text-decoration:none}
.cta.ghost{background:none;color:var(--gold2);border:1px solid var(--gold2)}
section.s{padding:64px 0 8px}
h2.t{font-size:clamp(30px,5vw,40px);margin-bottom:8px}
.sub{color:var(--muted);margin-bottom:26px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;overflow:hidden;transition:border-color .2s}
.tile:hover{border-color:var(--gold)}
.tile .art{aspect-ratio:1/1.1}
.tile .tl{display:block;padding:12px 14px}
.tile b{display:block;font:600 22px "Cormorant Garamond",Georgia,serif}
.tile small{color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{padding:7px 20px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}
.tabs button[aria-pressed=true]{background:var(--plum);color:var(--gold2);border-color:var(--plum)}
#sort{padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;text-align:left;display:block;width:100%;transition:border-color .2s}
.card:hover{border-color:var(--gold)}
.art{display:grid;place-items:center;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover}
.card .art{aspect-ratio:4/5}
.art svg{width:46%}
.card .info{padding:14px 16px 18px}
.card small{color:var(--muted)}
.card h3{font-size:22px;margin:2px 0 4px}
.price{color:var(--gold);font-weight:500}
.empty{color:var(--muted);padding:30px 0}
footer{margin-top:72px;background:var(--plum);color:#f1d3de;padding:48px 0 28px}
.fcols{display:grid;gap:28px;grid-template-columns:1fr}
@media(min-width:720px){.fcols{grid-template-columns:2fr 1fr 1fr}}
footer .brand{color:var(--gold2);display:block;margin-bottom:8px}
footer h4{font:500 15px Jost,sans-serif;color:var(--gold2);margin-bottom:10px}
footer a,footer .lnk{display:block;text-decoration:none;opacity:.9;padding:3px 0;text-align:left}
.copy{margin-top:34px;padding-top:18px;border-top:1px solid rgba(255,255,255,.15);font-size:14px;opacity:.75}
.ov{position:fixed;inset:0;background:rgba(25,5,15,.6);display:none;z-index:20;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.ov.side{justify-content:flex-end;padding:0;align-items:stretch}
.panel{background:var(--surface);max-width:440px;width:100%;max-height:100%;overflow:auto;padding:24px;border-radius:6px}
.panel.wide{max-width:780px}
.side .panel{height:100%;max-width:400px;border-radius:0}
.panel h2{font-size:32px;margin-bottom:6px}
.x{float:right;font-size:28px;line-height:1}
.pm{display:grid;gap:20px;margin-top:10px}
@media(min-width:640px){.pm{grid-template-columns:1fr 1fr}}
.pm .art{aspect-ratio:4/5;border-radius:4px}
.btn{display:block;width:100%;background:var(--plum);color:var(--gold2);padding:13px;margin-top:16px;text-align:center;text-decoration:none;border-radius:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.qty button{width:28px;height:28px;border:1px solid var(--line);border-radius:50%}
.tot{display:flex;justify-content:space-between;font-size:20px;margin-top:18px}
.hint{color:var(--muted);font-size:14px}
/* setup */
.adm{background:var(--surface);border-top:1px solid var(--line);margin-top:64px}
.adm .in{max-width:780px;margin:0 auto;padding:32px 20px 24px}
.adm h2{font-size:34px}
.atabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 22px}
.atabs button{padding:10px 16px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.atabs button[aria-selected=true]{color:var(--ink);border-color:var(--gold)}
.f2{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:600px){.f2{grid-template-columns:1fr 1fr}.f2 .full{grid-column:1/-1}}
.adm label{display:block;color:var(--muted);font-size:14px}
.adm input,.adm select,.adm textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px}
.adm h3{font-size:26px;margin:26px 0 8px}
.adm .pick{position:relative;overflow:hidden;padding:18px;border:1px dashed var(--gold);border-radius:4px;text-align:center;color:var(--ink);cursor:pointer}
.adm .pick input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer;font-size:200px}
.prow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow .th{width:48px;height:48px;border-radius:4px;flex:none;overflow:hidden}
.prow .th img{width:100%;height:100%;object-fit:cover}
.prow .nm{flex:1;min-width:0}
.prow button,.sm{padding:6px 12px;border:1px solid var(--line);border-radius:4px}
.abar{position:sticky;bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;background:var(--surface);border-top:1px solid var(--line)}
.abar .btn{width:auto;margin:0;padding:11px 24px;background:var(--gold2);color:var(--plum);font-weight:500}
.adm .btn.save{width:auto;display:inline-block;margin-top:16px;margin-right:8px}
</style>
</head>
<body>
<header id="top"><a class="brand" id="hb" href="#top"></a><nav><a href="#collections">Collections</a><a href="#shop">Shop</a><a href="#contact">Contact</a></nav><span class="hr"><button class="cartbtn" id="open-cart">Cart (<span id="cc">0</span>)</button></span></header>
<section class="hero" id="hs"><div class="wrap"><h1 id="hh"></h1><p id="hp"></p><div class="ctas"><a class="cta" id="hc" href="#shop"></a><a class="cta ghost" id="hw" href="#" target="_blank" rel="noopener">Order on WhatsApp</a></div></div></section>
<section class="s wrap" id="collections"><h2 class="t">Shop by collection</h2><p class="sub">Three collections, handpicked.</p><div class="cols" id="cols"></div></section>
<section class="s wrap" id="shop"><h2 class="t">The collection</h2><div class="bar"><div class="tabs" id="tabs"></div><select id="sort" aria-label="Sort products"><option value="">Featured</option><option value="a">Price: low to high</option><option value="d">Price: high to low</option></select></div><div class="grid" id="grid"></div></section>
<section id="admin"></section>
<footer id="contact"><div class="wrap"><div class="fcols"><div><span class="brand" id="fb"></span><p id="ft"></p></div><div><h4>Shop</h4><button class="lnk" data-c="Bags" data-go="1">Bags</button><button class="lnk" data-c="Jewelry" data-go="1">Jewelry</button><button class="lnk" data-c="Slippers" data-go="1">Slippers</button></div><div><h4>Order</h4><a id="fw" href="#" target="_blank" rel="noopener">Chat on WhatsApp</a></div></div><div class="copy">© <span id="fn"></span></div></div></footer>
<script type="application/json" id="data">{"name":"Imperial Crown Collection","wa":"0000000000","p":[["Regent Tote","Bags",450,"#8e2a55","#f5c9b8","Roomy structured tote with gold hardware and a suede-lined interior."],["Duchess Mini Bag","Bags",380,"#7a1f3d","#f8dccd","Compact crossbody with a chain strap, made for evenings out."],["Sovereign Clutch","Bags",300,"#5a2a3f","#f5c9b8","Slim envelope clutch with a magnetic clasp and a hidden card slot."],["Crown Pendant Necklace","Jewelry",250,"#fbe3e8","#8a3a52","Gold-tone crown pendant on a fine 45 cm chain."],["Pearl Drop Earrings","Jewelry",180,"#f6e4ea","#8e2a55","Freshwater-style pearls set in gold-tone hooks. Lightweight for all-day wear."],["Signet Ring","Jewelry",200,"#f9dfd3","#5c1f33","Classic engraved signet in a polished finish. Available in sizes 5 to 10."],["Palace Slides","Slippers",150,"#6b1238","#f5c9b8","Padded slides with a gold-trimmed strap and a cushioned footbed."],["Velvet Mules","Slippers",180,"#6b1b4a","#f8dccd","Soft velvet mules with a low heel. Comfortable at home or out."],["Gold-Strap Sandals","Slippers",120,"#fbe9e3","#8e3a4f","Flat sandals with adjustable gold straps and a non-slip sole."]]}</script>
<div class="ov" id="pm"><div class="panel wide" role="dialog" aria-modal="true" id="pbody"></div></div>
<div class="ov side" id="cm"><div class="panel" role="dialog" aria-modal="true" id="cbody"></div></div>

<script>
var WA="0000000000",P=[],cart={},cat="All",NAME="Imperial Crown Collection",ed=-1,tab="store";
var S={h1:"Bags, jewelry and slippers fit for royalty",sub:"Handpicked pieces for everyday elegance. Order in a few taps and we’ll confirm on WhatsApp.",cta:"Shop the collection",foot:"Delivery and payment confirmed when you order.",theme:"berry",hero:""};
var TH={berry:["#6b1238","#a8365a","#f5c9b8"],emerald:["#0f4a3c","#9a6b1f","#f0d9a0"],navy:["#1c2a4a","#b3486a","#f6cfd8"],noir:["#1a1a1f","#a67c1e","#e8c97a"]};
var ICON={
Bags:'<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><path d="M30 38c0-22 40-22 40 0"/><rect x="16" y="38" width="68" height="50" rx="8" fill="currentColor" fill-opacity=".15"/><circle cx="50" cy="60" r="5"/></svg>',
Jewelry:'<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><circle cx="50" cy="62" r="26"/><path d="M38 24h24l8 10-20 14-20-14z" fill="currentColor" fill-opacity=".2"/></svg>',
Slippers:'<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><path d="M14 70c0-30 18-48 34-48 16 0 22 14 22 28 0 8 8 8 16 12 4 2 2 8-4 8H18c-3 0-4-2-4-4z" fill="currentColor" fill-opacity=".15"/><path d="M34 52c8-6 20-6 28 0"/></svg>'};
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
try{var D=JSON.parse($("data").textContent);if(D.s)for(var k in D.s)S[k]=D.s[k];if(D.p){P=D.p;WA=D.wa||WA;NAME=D.name||NAME}}catch(e){}
function applyS(){var t=TH[S.theme]||TH.berry,r=document.documentElement.style;r.setProperty("--plum",t[0]);r.setProperty("--gold",t[1]);r.setProperty("--gold2",t[2]);
$("hh").textContent=S.h1;$("hp").textContent=S.sub;$("hc").textContent=S.cta;$("ft").textContent=S.foot;
$("hb").textContent=NAME;$("fb").textContent=NAME;$("fn").textContent=NAME;document.title=NAME;
$("hw").href=$("fw").href="https://wa.me/"+WA;
$("hs").style.backgroundImage=S.hero?"linear-gradient(rgba(25,5,15,.55),rgba(25,5,15,.55)),url("+S.hero+")":""}
function art(p){return '<div class="art" style="background:'+p[3]+';color:'+p[4]+'">'+(p[6]?'<img src="'+p[6]+'" alt="">':ICON[p[1]])+'</div>'}
function cols(){var h="";["Bags","Jewelry","Slippers"].forEach(function(c){var n=P.filter(function(p){return p[1]==c}),f=n.filter(function(p){return p[6]})[0]||n[0];
h+='<button class="tile" data-c="'+c+'" data-go="1">'+(f?art(f):'<div class="art" style="background:var(--plum);color:var(--gold2)">'+ICON[c]+'</div>')+'<span class="tl"><b>'+c+'</b><small>'+n.length+(n.length==1?' item':' items')+'</small></span></button>'});$("cols").innerHTML=h}
function tabs(){var h="";["All","Bags","Jewelry","Slippers"].forEach(function(c){h+='<button aria-pressed="'+(c==cat)+'" data-c="'+c+'">'+c+'</button>'});$("tabs").innerHTML=h}
function grid(){var l=P.map(function(p,i){return[p,i]}).filter(function(x){return cat=="All"||x[0][1]==cat}),s=$("sort").value;
if(s)l.sort(function(a,b){return s=="a"?a[0][2]-b[0][2]:b[0][2]-a[0][2]});
var h="";l.forEach(function(x){var p=x[0];h+='<button class="card" data-i="'+x[1]+'">'+art(p)+'<div class="info"><small>'+p[1]+'</small><h3>'+esc(p[0])+'</h3><div class="price">GH₵'+p[2]+'</div></div></button>'});
$("grid").innerHTML=h||'<p class="empty">No products here yet.</p>'}
function show(i){var p=P[i];$("pbody").innerHTML='<button class="x" data-close="pm" aria-label="Close">×</button><div class="pm">'+art(p)+'<div><small class="hint">'+p[1]+'</small><h2>'+esc(p[0])+'</h2><div class="price" style="font-size:22px">GH₵'+p[2]+'</div><p style="margin-top:12px">'+esc(p[5])+'</p><button class="btn" data-add="'+i+'">Add to cart</button></div></div>';$("pm").classList.add("on")}
function count(){var n=0;for(var k in cart)n+=cart[k];$("cc").textContent=n}
function drawCart(){var h='<button class="x" data-close="cm" aria-label="Close">×</button><h2>Your cart</h2>',t=0,msg="Hello, I’d like to order:%0A",any=false;
for(var k in cart){any=true;var p=P[k],q=cart[k];t+=p[2]*q;msg+=encodeURIComponent(q+" × "+p[0]+" (GH₵"+(p[2]*q)+")")+"%0A";
h+='<div class="row"><div><strong>'+esc(p[0])+'</strong><br><small>GH₵'+p[2]+'</small></div><div class="qty"><button data-q="'+k+'" data-d="-1" aria-label="Remove one">−</button> '+q+' <button data-q="'+k+'" data-d="1" aria-label="Add one">+</button></div></div>'}
if(!any){h+='<p class="empty">Your cart is empty. Pick something from the collection.</p>'}
else{msg+=encodeURIComponent("Total: GH₵"+t);h+='<div class="tot"><span>Total</span><strong>GH₵'+t+'</strong></div><a class="btn" href="https://wa.me/'+WA+'?text='+msg+'" target="_blank" rel="noopener">Order on WhatsApp</a>'}
$("cbody").innerHTML=h}
function render(){cols();tabs();grid()}
document.addEventListener("click",function(e){var t=e.target.closest("button,.ov");if(!t)return;
if(t.dataset.c){cat=t.dataset.c;tabs();grid();if(t.dataset.go)$("shop").scrollIntoView()}
else if(t.dataset.i){show(t.dataset.i)}
else if(t.dataset.add){var k=t.dataset.add;cart[k]=(cart[k]||0)+1;count();$("pm").classList.remove("on");drawCart();$("cm").classList.add("on")}
else if(t.dataset.q){var k=t.dataset.q;cart[k]+=+t.dataset.d;if(cart[k]<1)delete cart[k];count();drawCart()}
else if(t.dataset.close){$(t.dataset.close).classList.remove("on")}
else if(t.id=="open-cart"){drawCart();$("cm").classList.add("on")}
else if(t.classList.contains("ov")&&e.target===t){t.classList.remove("on")}});
document.addEventListener("keydown",function(e){if(e.key=="Escape"){$("pm").classList.remove("on");$("cm").classList.remove("on")}});
$("sort").addEventListener("change",grid);

/* store setup (owner only) */
function am(t){var m=$("a-m");if(m)m.textContent=t}
function adm(){var h='<div class="in"><h2>Store setup</h2><p class="hint">Only you can see this. Changes go live when you press the publish button.</p><div class="atabs" role="tablist">'+[["store","Store"],["home","Home page"],["prod","Products"]].map(function(t){return '<button role="tab" data-t="'+t[0]+'" aria-selected="'+(t[0]==tab)+'">'+t[1]+'</button>'}).join("")+'</div>';
if(tab=="store")h+='<div class="f2"><label>Store name<input id="a-n" value="'+esc(NAME)+'"></label><label>WhatsApp number<input id="a-w" inputmode="numeric" value="'+esc(WA)+'"><span class="hint">Country code first, digits only.</span></label></div>';
if(tab=="home")h+='<div class="f2"><label class="full">Main heading<input id="a-h" value="'+esc(S.h1)+'"></label><label class="full">Short intro<textarea id="a-s" rows="3">'+esc(S.sub)+'</textarea></label><label>Button text<input id="a-c" value="'+esc(S.cta)+'"></label><label>Colour theme<select id="a-t">'+[["berry","Berry and rose gold"],["emerald","Emerald and gold"],["navy","Navy and blush"],["noir","Black and gold"]].map(function(o){return '<option value="'+o[0]+'"'+(o[0]==S.theme?' selected':'')+'>'+o[1]+'</option>'}).join("")+'</select></label><label class="full">Footer note<input id="a-f" value="'+esc(S.foot)+'"></label><div class="full"><label class="pick">Tap to choose a banner photo<input id="a-hi" type="file" accept="image/*"></label><p id="a-hn" class="hint">'+(S.hero?'A banner photo is set. <button class="sm" data-nh="1">Remove it</button>':'')+'</p></div></div>';
if(tab=="prod"){h+='<h3>Your products</h3>';
P.forEach(function(q,i){h+='<div class="prow"><div class="th" style="background:'+q[3]+'">'+(q[6]?'<img src="'+q[6]+'" alt="">':'')+'</div><div class="nm"><strong>'+esc(q[0])+'</strong><br><span class="hint">'+q[1]+' · GH₵'+q[2]+'</span></div><button data-e="'+i+'">Edit</button><button data-x="'+i+'">Delete</button></div>'});
var p=ed>=0?P[ed]:["","Bags","","","","",""];
h+='<h3 id="a-top">'+(ed>=0?'Edit product':'Add a product')+'</h3><div class="f2"><label>Name<input id="a-pn" value="'+esc(p[0])+'"></label><label>Price (GH₵)<input id="a-pp" type="number" min="0" value="'+p[2]+'"></label><label>Category<select id="a-pc">'+["Bags","Jewelry","Slippers"].map(function(c){return '<option'+(c==p[1]?' selected':'')+'>'+c+'</option>'}).join("")+'</select></label><label class="pick">Tap to choose a photo'+(ed>=0&&p[6]?' (optional, keeps the current one)':'')+'<input id="a-pi" type="file" accept="image/*"></label><label class="full">Description<textarea id="a-pd" rows="3">'+esc(p[5])+'</textarea></label></div><p id="a-fn" class="hint"></p><button class="btn save" data-save="1">'+(ed>=0?'Save product':'Add product')+'</button>'+(ed>=0?'<button class="sm" data-cancel="1">Cancel</button>':'')}
h+='</div><div class="abar"><span id="a-m" class="hint"></span><button class="btn" data-pub="1">'+(window.claude?'Publish changes':'Save to site')+'</button></div>';
$("admin").innerHTML=h}
function shrink(f,cb,mx){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,(mx||700)/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.78))};im.src=r.result};r.readAsDataURL(f)}
function save(){var n=$("a-pn").value.trim(),pv=$("a-pp").value,f=$("a-pi").files[0];if(!n||pv===""){am("Add a name and a price.");return}
function fin(img){var old=ed>=0?P[ed]:null,o=[n,$("a-pc").value,+pv,old?old[3]:"#8e2a55",old?old[4]:"#f5c9b8",$("a-pd").value.trim(),img||(old?old[6]:"")];if(old)P[ed]=o;else P.push(o);ed=-1;render();adm();am("Saved. Press the publish button to put it on the live site.")}
if(f)shrink(f,fin);else fin("")}
async function pub(){am("Publishing…");try{var a=window.claude?await claude.use("artifact"):null;
var c=document.documentElement.cloneNode(true);
c.querySelector("#data").textContent=JSON.stringify({name:NAME,wa:WA,p:P,s:S}).replace(/</g,"\\u003c");
["tabs","grid","cols","admin","pbody","cbody"].forEach(function(i){c.querySelector("#"+i).innerHTML=""});
c.querySelector("#admin").className="";var mg=c.querySelector("#manage");if(mg)mg.remove();c.querySelectorAll(".ov").forEach(function(o){o.classList.remove("on")});c.querySelector("#cc").textContent="0";
var html="<!DOCTYPE html>\n"+c.outerHTML;
if(a)await a.publish(html);else{var pw=localStorage.getItem("pw")||prompt("Admin password");if(!pw){am("Password needed.");return}var r=await fetch("/.netlify/functions/store",{method:"POST",headers:{"content-type":"application/json","x-admin-password":pw},body:JSON.stringify({name:NAME,wa:WA,p:P,s:S})});if(r.status==401){localStorage.removeItem("pw");am("Wrong password. Try again.");return}if(!r.ok){am("Couldn’t save (error "+r.status+").");return}localStorage.setItem("pw",pw);am("Saved. Your live site is updated.")}}catch(e){am("Couldn’t publish: "+(e&&e.message||e))}}
$("admin").addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;var d=t.dataset;
if(d.t){tab=d.t;adm()}
else if(d.e){ed=+d.e;adm();$("a-top").scrollIntoView()}
else if(d.x){P.splice(+d.x,1);ed=-1;render();adm()}
else if(d.cancel){ed=-1;adm()}
else if(d.nh){S.hero="";applyS();adm()}
else if(d.save){save()}
else if(d.pub){pub()}});
$("admin").addEventListener("input",function(e){var i=e.target.id,v=e.target.value;
if(i=="a-n")NAME=v.trim()||NAME;else if(i=="a-w")WA=v.replace(/\D/g,"");else if(i=="a-h")S.h1=v;else if(i=="a-s")S.sub=v;else if(i=="a-c")S.cta=v;else if(i=="a-f")S.foot=v;else if(i=="a-t")S.theme=v;else return;applyS()});
$("admin").addEventListener("change",function(e){var i=e.target.id,f=e.target.files&&e.target.files[0];
if(i=="a-hi"&&f)shrink(f,function(u){S.hero=u;applyS();$("a-hn").textContent="Banner photo set."},1400);
if(i=="a-pi")$("a-fn").textContent=f?"Selected: "+f.name:""});
(async function(){try{var u=window.claude&&await claude.use("user");if((u&&u.isOwner())||(!window.claude&&/admin/.test(location.hash))){$("admin").className="adm";adm();var l=document.createElement("a");l.id="manage";l.href="#admin";l.textContent="Manage store";document.querySelector(".hr").insertBefore(l,$("open-cart"))}}catch(e){}})();
applyS();render();
if(!window.claude)fetch("/.netlify/functions/store",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){if(d&&d.p){P=d.p;WA=d.wa||WA;NAME=d.name||NAME;if(d.s)for(var k in d.s)S[k]=d.s[k];applyS();render()}}).catch(function(){});
</script>
</body>
